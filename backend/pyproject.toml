[project]
name = "toko-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "pgserver>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    # httpx2 BUKAN typosquat, meski namanya berpola mencurigakan. Ia jalur
    # httpx 2.x, diterbitkan dengan nama distribusi baru. Diperiksa pada
    # 2026-08-08: penulis Tom Christie (pembuat httpx dan starlette),
    # sumber github.com/pydantic/httpx2, lisensi BSD-3-Clause, dan
    # starlette sendiri menulis `import httpx2 as httpx` di testclient.py
    # serta menganggap httpx lama usang. Terkunci ber-sha256 di uv.lock.
    "httpx2>=2.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ditulis tegas, bukan mengandalkan bawaan ruff, supaya pembaruan ruff
# tidak diam-diam mengubah aturan yang berlaku di proyek ini.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends() dan kawan-kawannya memang dipanggil di nilai bawaan argumen.
# Itu cara baku FastAPI, bukan jebakan nilai bawaan yang dapat berubah.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true

# pgserver tidak menyertakan informasi tipe (tanpa py.typed), sehingga mypy
# ketat menolak setiap atributnya. Dilonggarkan hanya untuk paket ini.
[[tool.mypy.overrides]]
module = ["pgserver", "pgserver.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tanpa ini, pytest tidak menemukan paket `app` dan `skrip`, karena proyek
# ini dijalankan langsung dari sumbernya dan tidak dipasang sebagai paket.
pythonpath = ["."]
