# Konfigurasi Apache agar sistem terbuka di http://localhost/toko
#
# Pasang dengan:
#   sudo cp deploy/apache-toko.conf /etc/apache2/conf-available/toko.conf
#   sudo a2enmod proxy proxy_http
#   sudo a2enconf toko
#   sudo systemctl reload apache2
#
# Yang dilayani Apache hanyalah hasil bangun React, yaitu berkas statis.
# Sisi Python tetap berjalan sebagai proses tersendiri di 127.0.0.1:8000,
# dan Apache hanya meneruskan permintaan API kepadanya. Kode sumber,
# berkas .env, dan basis data TIDAK pernah berada di bawah folder ini.

<Directory /var/www/html/toko>
    Options -Indexes
    AllowOverride None
    Require all granted

    # Aplikasi satu halaman: alamat apa pun yang bukan berkas nyata
    # dikembalikan ke index.html, supaya penelusuran halaman di dalam
    # aplikasi tetap bekerja saat disegarkan.
    RewriteEngine On
    RewriteBase /toko/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /toko/index.html [L]
</Directory>

# Permintaan API diteruskan ke uvicorn. Ditulis sebelum aturan berkas
# statis agar tidak tertangkap oleh aturan pengembalian ke index.html.
ProxyPreserveHost On
ProxyPass        /toko/api/  http://127.0.0.1:8000/api/
ProxyPassReverse /toko/api/  http://127.0.0.1:8000/api/

# Berkas tersembunyi dan berkas rahasia ditolak, sebagai lapis pengaman
# kedua seandainya ada yang tersalin ke sini karena kekeliruan.
<FilesMatch "^\.|\.(env|py|toml|lock|md|sql|dump|key|pem)$">
    Require all denied
</FilesMatch>
